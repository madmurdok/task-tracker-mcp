<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Board - task-tracker-mcp dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="board-header">
    <h1 id="board-title">Board</h1>
    <p class="connection-status" id="connection-status" hidden></p>
    <a href="index.html">All projects</a>
    <button class="shutdown-button" id="shutdown-button" type="button">Stop dashboard</button>
  </header>
  <main>
    <p class="error-state" id="error-state" hidden></p>
    <p class="doc-drift-banner" id="doc-drift-banner" hidden>
      The tracked design doc has changed since the task graph was last reconciled with it.
    </p>
    <div class="board" id="board"></div>
  </main>
  <dialog id="release-notes-dialog">
    <h2 id="release-notes-title"></h2>
    <pre id="release-notes-body"></pre>
    <button type="button" id="release-notes-close">Close</button>
  </dialog>
  <!-- A separate dialog from release-notes: that one is a <pre> of plain
       text, but a plan has structure - steps, a per-item strikethrough, an
       approval header, and a drift warning - none of which a <pre> can
       render. Read-only, same as the rest of the dashboard (REQUIREMENTS.md
       Item 8): there is no Approve button here, only what is already true in
       the database. Approval happens in chat, via approve_plan. -->
  <dialog id="plan-dialog">
    <h2 id="plan-title"></h2>
    <p id="plan-approval" class="plan-approval"></p>
    <p id="plan-drift-warning" class="plan-drift-warning" hidden></p>
    <ol id="plan-steps" class="plan-steps"></ol>
    <button type="button" id="plan-close">Close</button>
  </dialog>
  <script src="board.js"></script>
</body>
</html>
